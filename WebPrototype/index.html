<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1510" />
  <title>Beastbound Kingdom — 3D Mobile Prototype</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="topbar">
      <div class="panel"><b>BEAST POWER</b><span id="power">0</span></div>
      <div class="panel"><b>LEVEL</b><span id="level">1</span></div>
      <div class="panel"><b>XP</b><span id="xp">0 / 100</span></div>
    </div>
    <div id="message" class="message">Find a beast. Your axe is your first weapon.</div>
    <div id="joystick" class="joystick"><div id="stick"></div></div>
    <button id="attack" class="attack">AXE</button>
    <button id="upgrade" class="upgrade">UPGRADE SHELTER</button>
    <div class="hint">Landscape mode • Move • Fight • Survive</div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
